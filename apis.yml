aid: malaeb
name: Malaeb
description: >-
  Malaeb (ملاعب) is the #1 sports pitch and facility booking application in the MENA
  region, letting players discover and reserve stadiums, courts, and pitches around
  them across Bahrain, Saudi Arabia, Kuwait, the United Arab Emirates, and Oman.
  Backed by 500 Global, Malaeb connects players and venue operators through a consumer
  mobile marketplace. As of this enrichment pass the company publishes no public
  developer API, documentation, or well-known discovery surface; its web presence is
  a WordPress marketing site fronting a React single-page application.
